[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: 耗时 >1s 的测试（SKIP_SLOW=1 时跳过）
    qt: 需要真实 Qt（PySide6 offscreen）的测试
    engine: 纯引擎逻辑测试（不依赖 Qt）
    regression: 回归断言（每轮必须跑）
addopts = -q -ra
# 覆盖率：需要 pytest-cov。默认**不设** --cov-fail-under 门控——
# 引擎大量分支只有真机/真实设备才走到，初期设门控只会长期红。
# 需要时手动加： pytest --cov=src/player --cov-report=term-missing
