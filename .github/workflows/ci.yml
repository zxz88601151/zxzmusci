name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # PySide6-Essentials：只需 QtCore/QtWidgets，避免拉入数百 MB 的 Addons
          pip install PySide6-Essentials pytest pytest-cov

      # 【D3 修复】Ubuntu headless 下 QtGui/QtWidgets 需要这些系统库；
      # 缺了会让 QApplication() 在**收集期**抛错，整步以"收集错误"失败（而非 skip）。
      - name: 安装 Qt 运行时系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: 引擎测试（无需 Qt，也不需要显示器）
        run: pytest -m engine -v --tb=short

      # Qt 测试（offscreen 无头）+ D3 守卫。
      #
      # conftest 的 qt_app fixture 在平台初始化失败时**降级为 skip**（必要，
      # 否则 headless 会变收集期硬错误）。副作用：可能"0 通过 N skip 却 SUCCESS"，
      # 即**一条 Qt 断言没跑也算绿**。故同一步内跑测试 + 结构化判定。
      #
      # 判定逻辑放在 tests/ci_qt_guard.py（可本地单测），workflow 里零 heredoc、
      # 零文本解析 —— 避免 YAML 块标量缩进与 grep 跨平台差异这两个坑。
      - name: "Qt 测试（offscreen 无头）+ 守卫"
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -uo pipefail
          rm -f qt_guard.xml
          set +e
          pytest -m qt --junitxml=qt_guard.xml -v --tb=short -p no:cacheprovider
          PYTEST_RC=$?
          set -e
          echo "pytest exit code = $PYTEST_RC"
          echo "--- junitxml ---"
          cat qt_guard.xml || echo "(无 junitxml)"
          echo
          python tests/ci_qt_guard.py qt_guard.xml "$PYTEST_RC"

      # 【D4 修复】regression 已拆成 21 个可定位用例（原先仅 1 个）。
      # 失败时可直接从测试名（test_r09_...）定位，无需翻日志。
      - name: 回归套件（每轮必须绿）
        run: pytest -m regression -v --tb=short

      - name: 覆盖率报告（不设门控）
        if: matrix.python-version == '3.11'
        run: pytest -m engine --cov=src/player --cov-report=term-missing
